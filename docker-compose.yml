services:
  app:
    build:
      context: ./app
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3000/api/health > /dev/null || exit 1"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  tests:
    build:
      context: ./tests
    depends_on:
      app:
        condition: service_healthy